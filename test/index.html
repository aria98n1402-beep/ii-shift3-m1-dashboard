  const KEY = 'ish3-m1-pw';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const open = async (pw) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
    return new TextDecoder().decode(plain);
  };
  const show = (html) => { document.open(); document.write(html); document.close(); };
  const err = document.getElementById('err');
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved).then(show).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} });
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const pw = document.getElementById('pw').value;
    try {
      const html = await open(pw);
      if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
      show(html);
    } catch (e) {
      err.textContent = 'Неверный пароль. Проверьте раскладку и попробуйте ещё раз.';
    }
  });
})();
